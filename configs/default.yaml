# Text2GS Default Configuration

# Device
device: "cuda:0"

# Output directory
output_dir: "./output"

# Memory optimization
unload_between_stages: true

# External paths (absolute paths)
paths:
  mvdiffusion_path: "/root/autodl-tmp/Text2GS/extern/MVDiffusion"
  viewcrafter_path: "/root/autodl-tmp/Text2GS/extern/ViewCrafter"
  dust3r_path: "/root/autodl-tmp/Text2GS/extern/dust3r"
  gaussian_splatting_path: "/root/autodl-tmp/gaussian-splatting"

# Stage 1: MVDiffusion
mvdiffusion:
  num_views: 8
  resolution: 512
  fov: 90
  guidance_scale: 9.0
  diff_timesteps: 50
  checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/mvdiffusion/pano.ckpt"

# Stage 2: Point Cloud (DUSt3R)
pointcloud:
  batch_size: 1
  niter: 300
  lr: 0.01
  schedule: "linear"
  min_conf_thr: 3.0
  checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/dust3r/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth"

# Stage 3: ViewCrafter
viewcrafter:
  video_length: 25
  ddim_steps: 50
  guidance_scale: 7.5
  min_conf_thr: 3.0
  bg_trd: 0.2
  
  # 采样配置（二选一）
  # 方式1: 指定采样帧数（推荐）
  num_sampled_frames: 16  # 采样30帧（不包括8个原始帧），总共38帧用于DUSt3R重建
  
  # 方式2: 指定采样间隔（如果num_sampled_frames为null则使用此方式）
  # sample_rate: 6  # 每6帧采样1帧
  
  checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/viewcrafter/model_sparse.ckpt"
  config: "/root/autodl-tmp/Text2GS/extern/ViewCrafter/configs/inference_pvd_1024.yaml"
  # DUSt3R reconstruction parameters
  batch_size: 1
  niter: 300
  lr: 0.01
  schedule: "linear"
  dust3r_checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/dust3r/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth"

# Stage 4: 3D Gaussian Splatting
gaussian:
  export_only: false  # Set to false to train 3D-GS directly
  iterations: 7000
  opacity_reset_interval: 100000  # 禁用透明度重置，避免删除有效点导致空洞
  max_init_points: 500000  # 初始点云数量（从154万下采样到50万）
