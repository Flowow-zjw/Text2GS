# Text2GS Configuration - Use All Frames Mode
# 使用所有生成的帧进行DUSt3R重建（约169帧）

# Device
device: "cuda:0"

# Output directory
output_dir: "./output"

# Memory optimization
unload_between_stages: true

# External paths (absolute paths)
paths:
  mvdiffusion_path: "/root/autodl-tmp/Text2GS/extern/MVDiffusion"
  viewcrafter_path: "/root/autodl-tmp/Text2GS/extern/ViewCrafter"
  dust3r_path: "/root/autodl-tmp/Text2GS/extern/dust3r"
  gaussian_splatting_path: "/root/autodl-tmp/gaussian-splatting"

# Stage 1: MVDiffusion
mvdiffusion:
  num_views: 8
  resolution: 512
  fov: 90
  guidance_scale: 9.0
  diff_timesteps: 50
  checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/mvdiffusion/pano.ckpt"

# Stage 2: Point Cloud (DUSt3R)
pointcloud:
  batch_size: 1
  niter: 300
  lr: 0.01
  schedule: "linear"
  min_conf_thr: 3.0
  checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/dust3r/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth"

# Stage 3: ViewCrafter - 使用所有帧模式
viewcrafter:
  video_length: 10
  ddim_steps: 50
  guidance_scale: 7.5
  min_conf_thr: 3.0
  bg_trd: 0.2
  
  # ===== 关键配置：使用所有帧 =====
  use_all_frames: true  # 启用所有帧重建
  reconstruction_batch_size: 30  # 每批处理30张图像（可根据显存调整：24GB显存建议20-30）
  
  # 以下采样配置在use_all_frames=true时会被忽略
  num_sampled_frames: null
  sample_rate: 6
  
  checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/viewcrafter/model_sparse.ckpt"
  config: "/root/autodl-tmp/Text2GS/extern/ViewCrafter/configs/inference_pvd_1024.yaml"
  
  # DUSt3R reconstruction parameters
  batch_size: 1
  niter: 300
  lr: 0.01
  schedule: "linear"
  dust3r_checkpoint: "/root/autodl-tmp/Text2GS/checkpoints/dust3r/DUSt3R_ViTLarge_BaseDecoder_512_dpt.pth"

# Stage 4: 3D Gaussian Splatting
gaussian:
  export_only: false
  iterations: 7000
  opacity_reset_interval: 100000
  max_init_points: 300000  # 增加到30万，因为有更多的输入图像

# 说明：
# 1. use_all_frames=true 会使用ViewCrafter生成的所有约169帧
# 2. reconstruction_batch_size 控制每批处理的图像数量
#    - 24GB显存：建议20-30
#    - 48GB显存：建议40-50
# 3. 批次间通过重叠区域的相机位姿进行Procrustes对齐，确保在同一坐标系
# 4. 预计重建时间：约15-30分钟（取决于显存和batch size）
